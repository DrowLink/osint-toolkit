[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "drowlink-osint-toolkit"
version = "0.1.0"
description = "A bounded, passive OSINT CLI for public domain metadata"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "DrowLink"}]
keywords = ["osint", "dns", "tls", "security-headers", "reconnaissance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
osint-toolkit = "osint_toolkit.cli:main"
osint = "osint_toolkit.cli:main"
osint-shodan = "osint_toolkit.cli:main_shodan"
search-shodan = "osint_toolkit.cli:main_shodan"
osint-virustotal = "osint_toolkit.cli:main_virustotal"
search-virustotal = "osint_toolkit.cli:main_virustotal"
osint-ip2location = "osint_toolkit.cli:main_ip2location"
search-ip2location = "osint_toolkit.cli:main_ip2location"
osint-censys = "osint_toolkit.cli:main_censys"
search-censys = "osint_toolkit.cli:main_censys"


[project.urls]
Homepage = "https://github.com/DrowLink/osint-toolkit"
Issues = "https://github.com/DrowLink/osint-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["osint_toolkit"]
